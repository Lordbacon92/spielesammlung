<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielesammlung</title>
<meta name="description" content="Geteilte Spielesammlung – COLLECT">
<meta property="og:title" content="Spielesammlung">
<meta property="og:description" content="Schau dir meine Spielesammlung an">
<link rel="icon" type="image/webp" href="favicon.webp">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE4; --surface: #FFFFFF; --surface2: #F7F3EE; --border: #D6CEBF;
    --text: #1A1714; --text-dim: #8A8178; --accent: #C0392B; --value: #C2410C;
    --radius: 6px; --radius-lg: 12px; --shadow: 0 1px 4px rgba(0,0,0,0.08);
    --font-head: 'Barlow Condensed', sans-serif; --font-body: 'Inter', sans-serif; --font-mono: 'DM Mono', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --surface: #1c1c1c; --surface2: #242424; --border: #3a3a3a; --text: #F0ECE6; --text-dim: #999; --accent: #FF5A4A; --value: #FF9838; --shadow: 0 1px 4px rgba(0,0,0,0.4); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }
  header h1 { font-family: var(--font-head); font-size: 44px; font-weight: 800; letter-spacing: 0.5px; line-height: 1; }
  header p { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; }
  .tabs { display: flex; gap: 8px; margin: 22px 0 12px; }
  .tab { font-family: var(--font-body); font-weight: 600; font-size: 13px; padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-dim); cursor: pointer; }
  .tab.active { border-color: var(--text); color: var(--text); }
  .search { width: 100%; font-size: 15px; padding: 11px 14px; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--surface); color: var(--text); margin-bottom: 14px; font-family: var(--font-body); }
  .plat { margin-bottom: 8px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); border-left: 4px solid var(--border); overflow: hidden; }
  .plat summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px; font-family: var(--font-head); font-size: 22px; font-weight: 700; }
  .plat summary::-webkit-details-marker { display: none; }
  .plat summary span { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); font-weight: 400; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border-top: 1px solid var(--surface2); font-size: 14px; }
  .thumb { width: 30px; height: 40px; border-radius: 3px; background: var(--surface2); flex-shrink: 0; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { flex: 1; min-width: 0; }
  .b { font-family: var(--font-mono); font-size: 10px; padding: 1px 6px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
  .b.q { background: var(--text); color: var(--bg); font-weight: 600; }
  .b.e { border: 1px solid var(--border); color: var(--text-dim); }
  .b.z-cib { background: #2E6FD9; color: #fff; }
  .b.z-sealed { background: #8B5CF6; color: #fff; }
  .msg { text-align: center; color: var(--text-dim); padding: 60px 0; font-size: 14px; line-height: 1.6; }
  footer { text-align: center; margin-top: 30px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Spielesammlung</h1>
    <p id="sub">lädt …</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <input class="search" id="search" type="search" placeholder="Spiel suchen …" oninput="render()" style="display:none">
  <div id="list"><div class="msg">Lade Sammlung …</div></div>
  <footer>Erstellt mit COLLECT</footer>
</div>
<script>
const PROJECT = 'collect-spielesammlung';
const API_KEY = 'AIzaSyDOz7P4B5TpbhWTHraxx9T2bNYrGqPHwIs';
let SHARE = null, TAB = null;

// Firestore-REST-Werte → normales JSON
function dec(v) {
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return parseInt(v.integerValue, 10);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(dec);
  if ('mapValue' in v) { const o = {}; const f = v.mapValue.fields || {}; for (const k in f) o[k] = dec(f[k]); return o; }
  return null;
}
function _lum(h) { const c = [1,3,5].map(function(i){ let x = parseInt(h.substr(i,2),16)/255; return x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4); }); return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2]; }
function _mix(h, t, to) { return '#' + [1,3,5].map(function(i){ const x = parseInt(h.substr(i,2),16); return ('0' + Math.round(x + (to-x)*t).toString(16)).slice(-2); }).join(''); }
function platCol(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  const L = _lum(hex);
  if (matchMedia('(prefers-color-scheme: dark)').matches) return L < 0.2 ? _mix(hex, Math.min(0.55, (0.2-L)*3.2+0.15), 255) : hex;
  return L > 0.3 ? _mix(hex, Math.min(0.45, (L-0.3)*1.6+0.15), 0) : hex;
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function thumb(u) { return 'https://images.weserv.nl/?url=' + encodeURIComponent(u) + '&w=96&h=128&fit=cover&output=webp&q=70'; }
function count(list) { let n = 0; for (const p in list) list[p].forEach(function(g) { n += g.q || 1; }); return n; }

async function load() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { fail('Kein Link angegeben.'); return; }
  try {
    const r = await fetch('https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/shares/' + encodeURIComponent(id) + '?key=' + API_KEY);
    if (r.status === 404 || r.status === 403) { fail('Diese Freigabe gibt es nicht (mehr).'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const f = j.fields || {}; SHARE = {};
    for (const k in f) SHARE[k] = dec(f[k]);
  } catch (e) { fail('Konnte nicht geladen werden. Bitte später erneut versuchen.'); return; }
  const name = SHARE.name || '';
  document.title = name ? 'Spielesammlung von ' + name : 'Spielesammlung';
  document.getElementById('title').textContent = name ? name + (/[sxzß]$/i.test(name) ? '’' : 's') + ' Sammlung' : 'Spielesammlung';
  const d = SHARE.updated ? new Date(SHARE.updated) : null;
  document.getElementById('sub').textContent = d ? 'Stand ' + d.toLocaleDateString('de-DE') : '';
  const tabs = Object.keys(SHARE.lists || {}).sort();   // Brauchen, Haben
  const order = ['Haben', 'Brauchen'].filter(function(t) { return tabs.indexOf(t) !== -1; });
  TAB = order[0];
  document.getElementById('tabs').innerHTML = order.map(function(t) {
    return '<button class="tab" data-t="' + t + '" onclick="TAB=\'' + t + '\';render()">' + (t === 'Haben' ? 'Sammlung' : 'Gesucht') + ' · ' + count(SHARE.lists[t]) + '</button>';
  }).join('');
  document.getElementById('search').style.display = '';
  render();
}
function fail(m) {
  document.getElementById('sub').textContent = '';
  document.getElementById('list').innerHTML = '<div class="msg">' + esc(m) + '</div>';
}
function render() {
  document.querySelectorAll('.tab').forEach(function(b) { b.classList.toggle('active', b.dataset.t === TAB); });
  const list = (SHARE.lists || {})[TAB] || {};
  const q = document.getElementById('search').value.trim().toLowerCase();
  const order = (SHARE.order || []).concat(Object.keys(list).filter(function(k) { return (SHARE.order || []).indexOf(k) === -1; }));
  let h = '';
  order.forEach(function(p) {
    let games = list[p]; if (!games || !games.length) return;
    if (q) games = games.filter(function(g) { return g.n.toLowerCase().indexOf(q) !== -1; });
    if (!games.length) return;
    const label = (SHARE.labels || {})[p] || p, col = platCol((SHARE.colors || {})[p] || '');
    h += '<details class="plat"' + (q || Object.keys(list).length <= 2 ? ' open' : '') + ' style="border-left-color:' + esc(col || 'var(--border)') + '">' +
         '<summary style="color:' + esc(col || 'var(--text)') + '">' + esc(label) + '<span>' + games.reduce(function(s, g) { return s + (g.q || 1); }, 0) + '</span></summary>';
    games.forEach(function(g) {
      h += '<div class="row"><div class="thumb">' + (g.c ? '<img loading="lazy" src="' + esc(thumb(g.c)) + '" alt="">' : '') + '</div>' +
           '<div class="name">' + esc(g.n) + '</div>' +
           (g.q > 1 ? '<span class="b q">' + g.q + '×</span>' : '') +
           (g.e ? '<span class="b e">' + esc(g.e) + '</span>' : '') +
           (g.z === 'cib' ? '<span class="b z-cib">CIB</span>' : g.z === 'sealed' ? '<span class="b z-sealed">SEALED</span>' : '') +
           '</div>';
    });
    h += '</details>';
  });
  document.getElementById('list').innerHTML = h || '<div class="msg">Nichts gefunden.</div>';
}
load();
</script>
</body>
</html>

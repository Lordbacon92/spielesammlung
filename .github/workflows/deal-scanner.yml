name: Deal-Scanner

# Läuft als Dauerschleife: ein Lauf scannt ~5,5 Stunden lang alle 30 Minuten
# und startet sich danach selbst neu. Der Zeitplan unten ist nur das Sicherheitsnetz,
# falls die Kette einmal abreißt (stündlich; läuft schon eine Schleife, wartet er bzw. entfällt).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      single:
        description: 'Nur einmal scannen (ohne Dauerschleife)'
        type: boolean
        default: false

concurrency:
  group: deal-scanner
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Scannen (Schleife)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_ZIP: ${{ vars.EBAY_ZIP }}
          MAX_CALLS: ${{ vars.MAX_CALLS || '100' }}
          DEBUG_DEALS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          ROUNDS: ${{ inputs.single && '1' || '11' }}
        run: |
          for i in $(seq 1 "$ROUNDS"); do
            echo "── Runde $i/$ROUNDS · $(date -u +%H:%M) UTC"
            node scan.mjs || echo "::warning::Runde $i fehlgeschlagen"
            DEBUG_DEALS=""
            if [ "$i" -lt "$ROUNDS" ]; then sleep 1800; fi
          done
      - name: Nächste Schleife starten
        if: ${{ always() && !inputs.single }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deal-scanner.yml --repo "$GITHUB_REPOSITORY" --ref main
